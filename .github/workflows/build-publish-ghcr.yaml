name: Build & Publish Docker image

on:
  push:
    tags:
      - '[1-9].*.*'

env:
  IMAGE_NAME: ghcr.io/finxico/fineract

permissions:
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build & push with JIB
        # Usamos el plugin JIB de Maven para compilar + docker push
        run: |
          mvn compile \
            com.google.cloud.tools:jib-maven-plugin:3.3.1:build \
            -Dimage=${{ env.IMAGE_NAME }} \
            -Djib.to.tags=${{ github.ref_name }},latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Log success
        run: echo "✔️ Imagen $IMAGE_NAME:${{ github.ref_name }} y :latest publicada en GHCR"

